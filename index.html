<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик — Онлайн</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            background: #eef4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 360px;
            width: 100%;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 16px 16px;
            box-shadow: 0 6px 16px -6px rgba(0,20,30,0.10);
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: opacity 0.3s;
        }
        .card.hidden {
            display: none;
        }
        .reset-btn {
            position: absolute;
            top: 6px;
            left: 8px;
            background: transparent;
            border: none;
            font-size: 0.85rem;
            color: #9aafbb;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 30px;
            transition: 0.1s;
            font-weight: 300;
        }
        .reset-btn:hover {
            color: #2d4d61;
            background: #eef3f7;
        }
        .stat-row {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 4px 0;
            border-bottom: 1px solid #f0f5f9;
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #3d5f72;
            font-weight: 450;
            font-size: 0.7rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .stat-value {
            font-weight: 550;
            font-size: 1rem;
            color: #0c293b;
            letter-spacing: -0.01em;
        }
        .stat-value.price {
            font-size: 1.6rem;
            font-weight: 600;
        }
        .stat-value input {
            width: 70px;
            padding: 4px 8px;
            border: 2px solid #d0dce6;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            color: #0c293b;
            background: #f8fafc;
            outline: none;
            transition: 0.15s;
            font-family: inherit;
            text-align: right;
            -moz-appearance: textfield;
        }
        .stat-value input:disabled {
            opacity: 0.4;
            background: #eef4f8;
            cursor: not-allowed;
        }
        .stat-value input::-webkit-inner-spin-button,
        .stat-value input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .stat-value input:focus {
            border-color: #0b2b3d;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(11,43,61,0.1);
        }
        .stat-value input:focus:disabled {
            border-color: #d0dce6;
            box-shadow: none;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }
        .btn-group .plus-btn {
            flex: 1;
            background: #0b2b3d;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            padding: 8px 0;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 0 #04161f, 0 3px 8px -4px rgba(0,20,30,0.15);
            transition: all 0.06s linear;
            line-height: 1;
        }
        .btn-group .plus-btn:disabled {
            opacity: 0.3;
            transform: none !important;
            box-shadow: 0 2px 0 #04161f, 0 3px 8px -4px rgba(0,20,30,0.15);
            cursor: not-allowed;
        }
        .btn-group .plus-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #04161f, 0 2px 6px -4px rgba(0,20,30,0.12);
        }
        .btn-group .plus-btn:hover:not(:disabled) {
            background: #13465e;
        }
        .hint {
            margin-top: 8px;
            font-size: 0.5rem;
            color: #b0c7d5;
            text-align: center;
            letter-spacing: 0.02em;
        }
        .total-s {
            background: #ffffffd0;
            border-radius: 20px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #1f4962;
            font-weight: 450;
            box-shadow: 0 4px 12px -4px rgba(0,20,30,0.08);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }
        .total-s.hidden {
            opacity: 0.3;
            pointer-events: none;
        }
        .total-s-value {
            font-weight: 600;
            color: #0c293b;
        }
        .total-s .manual-hint {
            font-size: 0.65rem;
            color: #6a8b9e;
            font-weight: 400;
        }
        .create-btn {
            background: #0b2b3d;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 14px 0;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #04161f, 0 6px 16px -4px rgba(0,20,30,0.2);
            transition: all 0.08s linear;
            line-height: 1;
            width: 100%;
            letter-spacing: 0.03em;
        }
        .create-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #04161f, 0 4px 12px -4px rgba(0,20,30,0.15);
        }
        .create-btn:hover {
            background: #13465e;
        }
        .create-btn:disabled {
            opacity: 0.4;
            transform: none !important;
            box-shadow: 0 4px 0 #04161f, 0 6px 16px -4px rgba(0,20,30,0.2);
            cursor: not-allowed;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #3d5f72;
            background: #eef4f8;
            padding: 6px 14px;
            border-radius: 30px;
        }
        .info-row .label {
            font-weight: 450;
        }
        .info-row .value {
            font-weight: 600;
            color: #0c293b;
        }
        .connection-status {
            font-size: 0.7rem;
            text-align: center;
            padding: 4px 12px;
            border-radius: 30px;
            background: #eef4f8;
            color: #3d5f72;
        }
        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }
        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        .version {
            text-align: center;
            font-size: 0.55rem;
            color: #b0c7d5;
            padding: 4px 0;
            letter-spacing: 0.05em;
        }
        .peer-id-display {
            font-size: 0.7rem;
            text-align: center;
            color: #3d5f72;
            background: #eef4f8;
            padding: 6px 12px;
            border-radius: 30px;
            font-family: monospace;
            word-break: break-all;
            user-select: text;
            cursor: text;
        }
        .bottom-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .role-badge {
            font-size: 0.6rem;
            text-align: center;
            padding: 2px 12px;
            border-radius: 30px;
            background: #0b2b3d;
            color: white;
            display: inline-block;
            margin: 0 auto;
        }
        .role-badge.host {
            background: #28a745;
        }
        .role-badge.client {
            background: #17a2b8;
        }
        @media (max-width: 480px) {
            .container { max-width: 100%; }
            .card { padding: 16px 12px 12px; }
            .stat-value.price { font-size: 1.3rem; }
            .stat-value input { width: 60px; font-size: 0.9rem; }
            .btn-group .plus-btn { font-size: 0.85rem; padding: 6px 0; }
            .total-s { font-size: 0.75rem; }
            .create-btn { font-size: 0.95rem; padding: 12px 0; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="connection-status" id="connectionStatus">⏳ Подключение...</div>
    <div style="text-align: center;">
        <span class="role-badge" id="roleBadge">⏳</span>
    </div>
    
    <button class="create-btn" id="createBtn">➕ Создать счётчик</button>

    <div class="info-row" id="infoRow">
        <span class="label">👥 n (человек)</span>
        <span class="value" id="nDisplay">0</span>
    </div>

    <div class="card hidden" id="card">
        <button class="reset-btn" id="resetBtn">↺</button>

        <div class="stat-row">
            <div class="stat-item">
                <span class="stat-label">статы</span>
                <span class="stat-value">
                    <input type="number" id="xInput" value="0" min="0" step="1" disabled>
                </span>
            </div>
            <div class="stat-item">
                <span class="stat-label">цена</span>
                <span class="stat-value price" id="priceDisplay">1</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="plus-btn" data-delta="1" disabled>+1</button>
            <button class="plus-btn" data-delta="10" disabled>+10</button>
            <button class="plus-btn" data-delta="50" disabled>+50</button>
        </div>

        <div class="hint">счётчик</div>
    </div>

    <div class="total-s hidden" id="totalSBlock">
        <span>📊 Текущее S</span>
        <span>
            <span class="total-s-value" id="totalS">0</span>
            <span class="manual-hint">(авто)</span>
        </span>
    </div>

    <div class="bottom-info">
        <div class="peer-id-display" id="peerIdDisplay">⏳ Получение Peer ID...</div>
        <div class="version" id="versionDisplay">v12</div>
    </div>
</div>

<script>
    (function() {
        const VERSION = 'v12';
        document.getElementById('versionDisplay').textContent = VERSION;

        const myId = Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        
        let allCounters = {};
        let connections = [];
        let myPeerId = null;
        let isCreated = false;
        let myX = 0;
        let isHost = false;
        let hostPeerId = null;
        let syncInterval = null;
        let isFirstUser = false;
        let isClientConnected = false;

        const peer = new Peer(undefined, {
            host: '0.peerjs.com',
            port: 443,
            secure: true
        });

        const createBtn = document.getElementById('createBtn');
        const card = document.getElementById('card');
        const totalSBlock = document.getElementById('totalSBlock');
        const nDisplay = document.getElementById('nDisplay');
        const peerIdDisplay = document.getElementById('peerIdDisplay');
        const connectionStatus = document.getElementById('connectionStatus');
        const roleBadge = document.getElementById('roleBadge');
        const xInput = document.getElementById('xInput');
        const priceDisplay = document.getElementById('priceDisplay');
        const totalSEl = document.getElementById('totalS');
        const resetBtn = document.getElementById('resetBtn');
        const plusBtns = document.querySelectorAll('.plus-btn');

        const A = 5;
        const SYNC_INTERVAL = 50;
        const TIMEOUT_MS = 1000;

        function getS() {
            let sum = 0;
            for (const key in allCounters) {
                if (allCounters[key].online) {
                    sum += allCounters[key].x || 0;
                }
            }
            return sum;
        }

        function getN() {
            let count = 0;
            for (const key in allCounters) {
                if (allCounters[key].online) count++;
            }
            return count;
        }

        function formatNumber(num) {
            if (!isFinite(num)) return '∞';
            return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function computePrice(xVal, S, n) {
            if (S <= 0 || n <= 0) return 1;
            const raw = (n * xVal * xVal) / (A * S);
            const rounded = Math.round(raw);
            return rounded < 1 ? 1 : rounded;
        }

        function updateUI() {
            const S = getS();
            const n = getN();

            nDisplay.textContent = n;
            totalSEl.textContent = formatNumber(S);

            const myCounter = allCounters[myId];
            if (myCounter && myCounter.online) {
                myX = myCounter.x || 0;
                xInput.value = myX;
                const price = computePrice(myX, S, n);
                priceDisplay.textContent = formatNumber(price);
            } else {
                xInput.value = 0;
                priceDisplay.textContent = '1';
            }
        }

        function createCounter() {
            if (isCreated) return;

            // ОПРЕДЕЛЯЕМ ХОСТА ТОЛЬКО ОДИН РАЗ!
            // Если мы подключились к хосту - мы клиент
            // Если нет - мы хост (первый пользователь)
            if (hostPeerId && hostPeerId !== myPeerId && isClientConnected) {
                isHost = false;
                roleBadge.textContent = '👤 КЛИЕНТ';
                roleBadge.className = 'role-badge client';
                console.log('👤 Я КЛИЕНТ, хост:', hostPeerId);
            } else {
                isHost = true;
                isFirstUser = true;
                roleBadge.textContent = '👑 ХОСТ';
                roleBadge.className = 'role-badge host';
                console.log('👑 Я ХОСТ! (первый пользователь)');
                hostPeerId = myPeerId;
            }

            allCounters[myId] = { x: 0, online: true, lastSeen: Date.now() };

            isCreated = true;
            createBtn.disabled = true;
            createBtn.textContent = '✅ Счётчик создан';
            card.classList.remove('hidden');
            totalSBlock.classList.remove('hidden');
            xInput.disabled = false;
            plusBtns.forEach(btn => btn.disabled = false);

            if (isHost) {
                startHostSync();
                broadcastToAll({
                    type: 'full_state',
                    counters: allCounters
                });
            } else {
                // Клиент отправляет свои данные хосту
                sendToHost({
                    type: 'client_join',
                    userId: myId,
                    peerId: myPeerId
                });
                sendToHost({
                    type: 'client_update',
                    userId: myId,
                    x: myX
                });
            }

            updateUI();
        }

        function startHostSync() {
            if (syncInterval) clearInterval(syncInterval);
            
            syncInterval = setInterval(() => {
                const now = Date.now();
                let changed = false;
                
                for (const key in allCounters) {
                    if (key !== myId && allCounters[key].online) {
                        if (now - allCounters[key].lastSeen > TIMEOUT_MS) {
                            console.log(`🗑️ Пользователь ${key} отключён (таймаут)`);
                            delete allCounters[key];
                            changed = true;
                        }
                    }
                }

                if (changed) {
                    broadcastToAll({
                        type: 'full_state',
                        counters: allCounters
                    });
                    updateUI();
                }

                broadcastToAll({
                    type: 'full_state',
                    counters: allCounters
                });
            }, SYNC_INTERVAL);
        }

        function broadcastToAll(data) {
            connections.forEach(conn => {
                if (conn.open) {
                    conn.send(data);
                }
            });
        }

        function sendToHost(data) {
            const hostConn = connections.find(c => c.peer === hostPeerId);
            if (hostConn && hostConn.open) {
                hostConn.send(data);
            } else {
                if (hostPeerId && hostPeerId !== myPeerId) {
                    console.log('🔄 Потеря связи с хостом, переподключение...');
                    connectToPeer(hostPeerId);
                }
            }
        }

        function receiveData(data, senderPeerId) {
            if (data.type === 'full_state') {
                allCounters = data.counters || {};
                if (allCounters[myId]) {
                    allCounters[myId].lastSeen = Date.now();
                }
                updateUI();
            }
            else if (data.type === 'client_update') {
                if (isHost) {
                    const { userId, x } = data;
                    if (allCounters[userId]) {
                        allCounters[userId].x = x || 0;
                        allCounters[userId].lastSeen = Date.now();
                        allCounters[userId].online = true;
                        updateUI();
                    }
                }
            }
            else if (data.type === 'client_join') {
                if (isHost) {
                    const { userId, peerId } = data;
                    if (!allCounters[userId]) {
                        allCounters[userId] = { x: 0, online: true, lastSeen: Date.now() };
                        console.log(`👤 Новый клиент: ${userId} (${peerId})`);
                        
                        const conn = connections.find(c => c.peer === senderPeerId);
                        if (conn && conn.open) {
                            conn.send({
                                type: 'full_state',
                                counters: allCounters
                            });
                        }
                        
                        broadcastToAll({
                            type: 'full_state',
                            counters: allCounters
                        });
                        updateUI();
                    }
                }
            }
            else if (data.type === 'client_leave') {
                if (isHost) {
                    const { userId } = data;
                    if (allCounters[userId]) {
                        console.log(`👋 Клиент ${userId} вышел`);
                        delete allCounters[userId];
                        broadcastToAll({
                            type: 'full_state',
                            counters: allCounters
                        });
                        updateUI();
                    }
                }
            }
            else if (data.type === 'who_is_host') {
                // Кто-то спрашивает, кто хост
                if (isHost) {
                    const conn = connections.find(c => c.peer === senderPeerId);
                    if (conn && conn.open) {
                        conn.send({
                            type: 'host_is',
                            hostId: myPeerId
                        });
                    }
                }
            }
            else if (data.type === 'host_is') {
                // Получили ответ о том, кто хост
                if (!isHost && !isClientConnected) {
                    const { hostId } = data;
                    hostPeerId = hostId;
                    isClientConnected = true;
                    console.log(`👤 Получен хост: ${hostId}`);
                    
                    // Отправляем хосту, что мы присоединились
                    sendToHost({
                        type: 'client_join',
                        userId: myId,
                        peerId: myPeerId
                    });
                    sendToHost({
                        type: 'client_update',
                        userId: myId,
                        x: myX
                    });
                }
            }
        }

        function setupConnection(conn) {
            conn.on('open', () => {
                connectionStatus.textContent = '🟢 Связано с ' + conn.peer.slice(0, 8);
                connectionStatus.className = 'connection-status connected';
                
                if (isHost) {
                    conn.send({
                        type: 'full_state',
                        counters: allCounters
                    });
                } else {
                    // Спрашиваем, кто хост
                    conn.send({
                        type: 'who_is_host'
                    });
                }
                
                updateUI();
            });

            conn.on('data', (data) => {
                receiveData(data, conn.peer);
            });

            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                connectionStatus.textContent = '🟡 Соединение потеряно';
                connectionStatus.className = 'connection-status disconnected';
                
                if (isHost) {
                    for (const key in allCounters) {
                        if (key !== myId) {
                            const hasConnection = connections.some(c => c.peer === key);
                            if (!hasConnection) {
                                delete allCounters[key];
                                broadcastToAll({
                                    type: 'full_state',
                                    counters: allCounters
                                });
                                updateUI();
                            }
                        }
                    }
                }
                updateUI();
            });
        }

        function connectToPeer(peerId) {
            if (connections.some(c => c.peer === peerId)) return;
            if (peerId === myPeerId) return;

            console.log(`🔗 Подключение к ${peerId}`);
            const conn = peer.connect(peerId);
            connections.push(conn);
            setupConnection(conn);
            connectionStatus.textContent = '🔄 Подключение к ' + peerId.slice(0, 8) + '...';
        }

        // --- PeerJS ---
        peer.on('open', (id) => {
            myPeerId = id;
            connectionStatus.textContent = '🟢 Подключено!';
            connectionStatus.className = 'connection-status connected';

            peerIdDisplay.textContent = '🆔 ' + id;
            peerIdDisplay.style.userSelect = 'text';

            const urlParams = new URLSearchParams(window.location.search);
            const connectTo = urlParams.get('connect');
            
            if (connectTo) {
                hostPeerId = connectTo;
                setTimeout(() => connectToPeer(connectTo), 500);
                roleBadge.textContent = '👤 КЛИЕНТ (подключение)';
                roleBadge.className = 'role-badge client';
            } else {
                roleBadge.textContent = '👑 ХОСТ (ожидание)';
                roleBadge.className = 'role-badge host';
                hostPeerId = id;
                isFirstUser = true;
            }
        });

        peer.on('connection', (conn) => {
            if (!connections.some(c => c.peer === conn.peer)) {
                connections.push(conn);
                setupConnection(conn);
                updateUI();
            }
        });

        peer.on('error', (err) => {
            console.error('Peer error:', err);
            if (!err.message.includes('unavailable')) {
                connectionStatus.textContent = '❌ Ошибка: ' + err.message;
                connectionStatus.className = 'connection-status disconnected';
            }
        });

        // --- События ---
        createBtn.addEventListener('click', createCounter);

        xInput.addEventListener('input', () => {
            if (!isCreated) return;
            let val = parseInt(xInput.value, 10);
            if (isNaN(val) || val < 0) val = 0;
            setX(val);
        });

        function setX(newX) {
            if (!isCreated) return;
            if (newX < 0) newX = 0;

            myX = newX;
            
            if (allCounters[myId]) {
                allCounters[myId].x = myX;
                allCounters[myId].lastSeen = Date.now();
            }

            if (!isHost && hostPeerId) {
                sendToHost({
                    type: 'client_update',
                    userId: myId,
                    x: myX
                });
            } else if (isHost) {
                broadcastToAll({
                    type: 'full_state',
                    counters: allCounters
                });
            }

            updateUI();
        }

        plusBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!isCreated) return;
                const delta = parseInt(btn.dataset.delta, 10);
                setX(myX + delta);
            });
        });

        resetBtn.addEventListener('click', () => {
            if (!isCreated) return;
            setX(0);
        });

        window.addEventListener('beforeunload', () => {
            if (isHost) {
                broadcastToAll({
                    type: 'full_state',
                    counters: {}
                });
            } else {
                sendToHost({
                    type: 'client_leave',
                    userId: myId
                });
            }
            if (syncInterval) clearInterval(syncInterval);
        });

        console.log('📊 Клиент-серверная архитектура v12');
        console.log('  • Версия:', VERSION);
        console.log('  • Только первый пользователь = Хост');
        console.log('  • Все остальные = Клиенты');
        console.log('  • Клиенты не могут стать хостами');
    })();
</script>
</body>
</html>

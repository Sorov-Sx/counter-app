<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик — Онлайн</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            background: #eef4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 360px;
            width: 100%;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 16px 16px;
            box-shadow: 0 6px 16px -6px rgba(0,20,30,0.10);
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: opacity 0.3s;
        }
        .card.hidden {
            display: none;
        }
        .reset-btn {
            position: absolute;
            top: 6px;
            left: 8px;
            background: transparent;
            border: none;
            font-size: 0.85rem;
            color: #9aafbb;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 30px;
            transition: 0.1s;
            font-weight: 300;
        }
        .reset-btn:hover {
            color: #2d4d61;
            background: #eef3f7;
        }
        .stat-row {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 4px 0;
            border-bottom: 1px solid #f0f5f9;
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #3d5f72;
            font-weight: 450;
            font-size: 0.7rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .stat-value {
            font-weight: 550;
            font-size: 1rem;
            color: #0c293b;
            letter-spacing: -0.01em;
        }
        .stat-value.price {
            font-size: 1.6rem;
            font-weight: 600;
        }
        .stat-value input {
            width: 70px;
            padding: 4px 8px;
            border: 2px solid #d0dce6;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            color: #0c293b;
            background: #f8fafc;
            outline: none;
            transition: 0.15s;
            font-family: inherit;
            text-align: right;
            -moz-appearance: textfield;
        }
        .stat-value input:disabled {
            opacity: 0.4;
            background: #eef4f8;
            cursor: not-allowed;
        }
        .stat-value input::-webkit-inner-spin-button,
        .stat-value input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .stat-value input:focus {
            border-color: #0b2b3d;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(11,43,61,0.1);
        }
        .stat-value input:focus:disabled {
            border-color: #d0dce6;
            box-shadow: none;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }
        .btn-group .plus-btn {
            flex: 1;
            background: #0b2b3d;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            padding: 8px 0;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 0 #04161f, 0 3px 8px -4px rgba(0,20,30,0.15);
            transition: all 0.06s linear;
            line-height: 1;
        }
        .btn-group .plus-btn:disabled {
            opacity: 0.3;
            transform: none !important;
            box-shadow: 0 2px 0 #04161f, 0 3px 8px -4px rgba(0,20,30,0.15);
            cursor: not-allowed;
        }
        .btn-group .plus-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #04161f, 0 2px 6px -4px rgba(0,20,30,0.12);
        }
        .btn-group .plus-btn:hover:not(:disabled) {
            background: #13465e;
        }
        .hint {
            margin-top: 8px;
            font-size: 0.5rem;
            color: #b0c7d5;
            text-align: center;
            letter-spacing: 0.02em;
        }
        .total-s {
            background: #ffffffd0;
            border-radius: 20px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #1f4962;
            font-weight: 450;
            box-shadow: 0 4px 12px -4px rgba(0,20,30,0.08);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }
        .total-s.hidden {
            opacity: 0.3;
            pointer-events: none;
        }
        .total-s-value {
            font-weight: 600;
            color: #0c293b;
        }
        .total-s .manual-hint {
            font-size: 0.65rem;
            color: #6a8b9e;
            font-weight: 400;
        }
        .create-btn {
            background: #0b2b3d;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 14px 0;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #04161f, 0 6px 16px -4px rgba(0,20,30,0.2);
            transition: all 0.08s linear;
            line-height: 1;
            width: 100%;
            letter-spacing: 0.03em;
        }
        .create-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #04161f, 0 4px 12px -4px rgba(0,20,30,0.15);
        }
        .create-btn:hover {
            background: #13465e;
        }
        .create-btn:disabled {
            opacity: 0.4;
            transform: none !important;
            box-shadow: 0 4px 0 #04161f, 0 6px 16px -4px rgba(0,20,30,0.2);
            cursor: not-allowed;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #3d5f72;
            background: #eef4f8;
            padding: 6px 14px;
            border-radius: 30px;
        }
        .info-row .label {
            font-weight: 450;
        }
        .info-row .value {
            font-weight: 600;
            color: #0c293b;
        }
        .connection-status {
            font-size: 0.7rem;
            text-align: center;
            padding: 4px 12px;
            border-radius: 30px;
            background: #eef4f8;
            color: #3d5f72;
        }
        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }
        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        .version {
            text-align: center;
            font-size: 0.55rem;
            color: #b0c7d5;
            padding: 4px 0;
            letter-spacing: 0.05em;
        }
        .peer-id-display {
            font-size: 0.7rem;
            text-align: center;
            color: #3d5f72;
            background: #eef4f8;
            padding: 6px 12px;
            border-radius: 30px;
            font-family: monospace;
            word-break: break-all;
            user-select: text;
            cursor: text;
        }
        .bottom-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        @media (max-width: 480px) {
            .container { max-width: 100%; }
            .card { padding: 16px 12px 12px; }
            .stat-value.price { font-size: 1.3rem; }
            .stat-value input { width: 60px; font-size: 0.9rem; }
            .btn-group .plus-btn { font-size: 0.85rem; padding: 6px 0; }
            .total-s { font-size: 0.75rem; }
            .create-btn { font-size: 0.95rem; padding: 12px 0; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="connection-status" id="connectionStatus">⏳ Подключение...</div>
    
    <button class="create-btn" id="createBtn">➕ Создать счётчик</button>

    <div class="info-row" id="infoRow">
        <span class="label">👥 n (человек)</span>
        <span class="value" id="nDisplay">0</span>
    </div>

    <div class="card hidden" id="card">
        <button class="reset-btn" id="resetBtn">↺</button>

        <div class="stat-row">
            <div class="stat-item">
                <span class="stat-label">статы</span>
                <span class="stat-value">
                    <input type="number" id="xInput" value="0" min="0" step="1" disabled>
                </span>
            </div>
            <div class="stat-item">
                <span class="stat-label">цена</span>
                <span class="stat-value price" id="priceDisplay">1</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="plus-btn" data-delta="1" disabled>+1</button>
            <button class="plus-btn" data-delta="10" disabled>+10</button>
            <button class="plus-btn" data-delta="50" disabled>+50</button>
        </div>

        <div class="hint">счётчик</div>
    </div>

    <div class="total-s hidden" id="totalSBlock">
        <span>📊 Текущее S</span>
        <span>
            <span class="total-s-value" id="totalS">0</span>
            <span class="manual-hint">(авто)</span>
        </span>
    </div>

    <div class="bottom-info">
        <div class="peer-id-display" id="peerIdDisplay">⏳ Получение Peer ID...</div>
        <div class="version" id="versionDisplay">v.0.0.8</div>
    </div>
</div>

<script>
    (function() {
        const VERSION = 'v.0.0.8';
        document.getElementById('versionDisplay').textContent = VERSION;

        // Уникальный ID этого пользователя
        const myId = Date.now() + '_' + Math.random().toString(36).slice(2, 7);

        // Все данные
        let allCounters = {};
        let connections = [];
        let myPeerId = null;
        let isCreated = false;
        let myX = 0;
        let allPeers = new Set(); // Все известные пиры

        const peer = new Peer(undefined, {
            host: '0.peerjs.com',
            port: 443,
            secure: true
        });

        const createBtn = document.getElementById('createBtn');
        const card = document.getElementById('card');
        const totalSBlock = document.getElementById('totalSBlock');
        const nDisplay = document.getElementById('nDisplay');
        const peerIdDisplay = document.getElementById('peerIdDisplay');
        const connectionStatus = document.getElementById('connectionStatus');
        const xInput = document.getElementById('xInput');
        const priceDisplay = document.getElementById('priceDisplay');
        const totalSEl = document.getElementById('totalS');
        const resetBtn = document.getElementById('resetBtn');
        const plusBtns = document.querySelectorAll('.plus-btn');

        const A = 5;

        function getS() {
            let sum = 0;
            for (const key in allCounters) {
                sum += allCounters[key].x || 0;
            }
            return sum;
        }

        function getN() {
            let count = 0;
            for (const key in allCounters) {
                if (allCounters[key].online) count++;
            }
            return count;
        }

        function formatNumber(num) {
            if (!isFinite(num)) return '∞';
            return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function computePrice(xVal, S, n) {
            if (S <= 0 || n <= 0) return 1;
            const raw = (n * xVal * xVal) / (A * S);
            const rounded = Math.round(raw);
            return rounded < 1 ? 1 : rounded;
        }

        function updateUI() {
            const S = getS();
            const n = getN();

            nDisplay.textContent = n;
            totalSEl.textContent = formatNumber(S);

            const myCounter = allCounters[myId];
            if (myCounter && myCounter.online) {
                myX = myCounter.x || 0;
                xInput.value = myX;
                const price = computePrice(myX, S, n);
                priceDisplay.textContent = formatNumber(price);
            } else {
                xInput.value = 0;
                priceDisplay.textContent = '1';
            }
        }

        function createCounter() {
            if (isCreated) return;

            allCounters[myId] = { x: 0, online: true };

            isCreated = true;
            createBtn.disabled = true;
            createBtn.textContent = '✅ Счётчик создан';
            card.classList.remove('hidden');
            totalSBlock.classList.remove('hidden');
            xInput.disabled = false;
            plusBtns.forEach(btn => btn.disabled = false);

            broadcastState();
            updateUI();
        }

        function setX(newX) {
            if (!isCreated) return;
            if (newX < 0) newX = 0;

            if (allCounters[myId]) {
                allCounters[myId].x = newX;
                myX = newX;
                broadcastState();
                updateUI();
            }
        }

        function resetCounter() {
            if (!isCreated) return;
            setX(0);
        }

        function broadcastState() {
            const state = {
                type: 'state',
                counters: allCounters,
                peers: Array.from(allPeers) // Передаём список всех пиров
            };
            connections.forEach(conn => {
                if (conn.open) {
                    conn.send(state);
                }
            });
        }

        function receiveState(data) {
            if (data.type === 'state') {
                // Обновляем данные
                for (const key in data.counters) {
                    if (!allCounters[key]) {
                        allCounters[key] = { x: 0, online: false };
                    }
                    allCounters[key].x = data.counters[key].x || 0;
                    allCounters[key].online = data.counters[key].online !== false;
                }

                // Получаем список всех пиров
                if (data.peers) {
                    data.peers.forEach(peerId => {
                        if (peerId !== myPeerId) {
                            allPeers.add(peerId);
                        }
                    });
                }

                // Если наш счётчик ещё не создан, но появился в данных
                if (allCounters[myId] && !isCreated) {
                    isCreated = true;
                    createBtn.disabled = true;
                    createBtn.textContent = '✅ Счётчик создан';
                    card.classList.remove('hidden');
                    totalSBlock.classList.remove('hidden');
                    xInput.disabled = false;
                    plusBtns.forEach(btn => btn.disabled = false);
                }

                // Подключаемся ко всем новым пирам
                setTimeout(connectToAllPeers, 300);

                updateUI();
            }
        }

        // --- Подключение ко ВСЕМ известным пирам ---
        function connectToAllPeers() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetPeer = urlParams.get('connect');
            
            // Добавляем целевого пира из URL
            if (targetPeer && targetPeer !== myPeerId) {
                allPeers.add(targetPeer);
            }

            // Подключаемся к каждому пиру
            allPeers.forEach(peerId => {
                if (peerId !== myPeerId && !connections.some(c => c.peer === peerId)) {
                    connectToPeer(peerId);
                }
            });
        }

        function connectToPeer(peerId) {
            if (connections.some(c => c.peer === peerId)) return;
            if (peerId === myPeerId) return;

            const conn = peer.connect(peerId);
            connections.push(conn);
            setupConnection(conn);
            connectionStatus.textContent = '🔄 Подключение к ' + peerId.slice(0, 8) + '...';
        }

        function setupConnection(conn) {
            conn.on('open', () => {
                connectionStatus.textContent = '🟢 Связано с ' + conn.peer.slice(0, 8);
                connectionStatus.className = 'connection-status connected';
                
                // Отправляем своё состояние
                conn.send({
                    type: 'state',
                    counters: allCounters,
                    peers: Array.from(allPeers)
                });

                // Добавляем в список
                allPeers.add(conn.peer);

                // Пробуем подключиться ко всем
                setTimeout(connectToAllPeers, 300);
                updateUI();
            });

            conn.on('data', (data) => {
                receiveState(data);
            });

            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                allPeers.delete(conn.peer);
                connectionStatus.textContent = '🟡 Соединение потеряно';
                connectionStatus.className = 'connection-status disconnected';
                
                // Проверяем, не удалился ли кто-то
                checkAndRemoveOffline();
                updateUI();
            });
        }

        // --- Проверка и удаление офлайн пользователей ---
        function checkAndRemoveOffline() {
            // Проверяем всех, кто есть в allCounters
            const activePeers = new Set();
            connections.forEach(conn => {
                if (conn.open) {
                    activePeers.add(conn.peer);
                }
            });
            // Добавляем себя
            activePeers.add(myPeerId);

            // Удаляем тех, кого нет в активных
            for (const key in allCounters) {
                // Пропускаем себя
                if (key === myId) continue;
                
                // Проверяем, есть ли такой peer
                let found = false;
                for (const peerId of activePeers) {
                    // Ищем соответствие между peerId и tabId
                    // Так как у нас нет прямой связи, используем эвристику
                    // Если пользователь не отвечает, удаляем его через некоторое время
                }
            }
        }

        // Периодическая проверка на офлайн
        setInterval(() => {
            // Проверяем соединения
            const openConnections = connections.filter(c => c.open);
            if (openConnections.length !== connections.length) {
                connections = openConnections;
                updateUI();
            }
        }, 5000);

        // --- PeerJS ---
        peer.on('open', (id) => {
            myPeerId = id;
            connectionStatus.textContent = '🟢 Подключено!';
            connectionStatus.className = 'connection-status connected';

            peerIdDisplay.textContent = '🆔 ' + id;
            peerIdDisplay.style.userSelect = 'text';

            // Добавляем себя в список
            allPeers.add(id);

            // Подключаемся ко всем
            setTimeout(connectToAllPeers, 500);
        });

        peer.on('connection', (conn) => {
            if (!connections.some(c => c.peer === conn.peer)) {
                connections.push(conn);
                allPeers.add(conn.peer);
                setupConnection(conn);
                updateUI();
            }
        });

        peer.on('error', (err) => {
            console.error('Peer error:', err);
            if (!err.message.includes('unavailable')) {
                connectionStatus.textContent = '❌ Ошибка: ' + err.message;
                connectionStatus.className = 'connection-status disconnected';
            }
        });

        // --- События ---
        createBtn.addEventListener('click', createCounter);

        xInput.addEventListener('input', () => {
            if (!isCreated) return;
            let val = parseInt(xInput.value, 10);
            if (isNaN(val) || val < 0) val = 0;
            setX(val);
        });

        plusBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!isCreated) return;
                const delta = parseInt(btn.dataset.delta, 10);
                setX(myX + delta);
            });
        });

        resetBtn.addEventListener('click', resetCounter);

        // При закрытии вкладки удаляем себя
        window.addEventListener('beforeunload', () => {
            if (allCounters[myId]) {
                delete allCounters[myId];
                broadcastState();
            }
        });

        console.log('📊 Многопользовательский онлайн-режим (Mesh-сеть)');
        console.log('  • Версия:', VERSION);
        console.log('  • Каждый подключается ко всем остальным');
        console.log('  • При закрытии вкладки пользователь удаляется');
    })();
</script>
</body>
</html>
